<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="css/bdaygif.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&family=Rammetto+One&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday GIF site</title>
  </head>
  <body>
    <div id="header">
      <h1>Today is Vasco's birthday!</h1>
      <img id="bff-img" src="images/vasco.png" alt="Vasco smile" />
      <h2 id="bday-age">24 years old</h2>
      <h4 id="bday-date">04.14.2014</h4>
    </div>
    <div class="gift-section">
      <h2 class="gift-title">Here's how happy I am for you today 🥳</h2>
      <h3 class="gift-hint">(Hover over the gift)</h3>
      <div class="gift-img"></div>
    </div>
  </body>
</html>
